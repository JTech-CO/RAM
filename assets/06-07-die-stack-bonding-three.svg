<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 6-7. 다이 적층 본딩 3종의 접합부 단면 비교</title>
<desc id="dsc">다이 2장 사이 접합부만을 세 방식으로 잘라 같은 기준면 위에 놓고, 범프의 유무가 다이 간 갭 높이로 이어져 스택 높이 한계와 만나는 경로를 표시합니다. 열 순서는 좌우 배열일 뿐 세대 교체가 아니며, 정량 배지 2건은 모두 TCB 대비 기준입니다. 스택 전체 형상과 단수, JEDEC의 높이 완화 논의는 이 그림에 포함하지 않았습니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- 열 제목 -->
<text class="t14 mid" x="165" y="30">TC-NCF</text>
<text class="t14 mid" x="445" y="30">MR-MUF</text>
<text class="t14 mid" x="725" y="30">하이브리드 본딩 (HCB)</text>

<!-- 공통 기준면 : 하부 다이 상면 y=200 -->
<line class="h d" x1="50" y1="200" x2="868" y2="200"/>

<!-- 열 1 : TC-NCF — 범프 3개 + 비전도성 필름, 갭 60 -->
<rect x="70"  y="140" width="31" height="60" fill="url(#dots)"/>
<rect x="119" y="140" width="37" height="60" fill="url(#dots)"/>
<rect x="174" y="140" width="37" height="60" fill="url(#dots)"/>
<rect x="229" y="140" width="31" height="60" fill="url(#dots)"/>
<rect class="s" x="101" y="140" width="18" height="60" rx="2"/>
<rect class="s" x="156" y="140" width="18" height="60" rx="2"/>
<rect class="s" x="211" y="140" width="18" height="60" rx="2"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="70" y="90"  width="190" height="50"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="70" y="200" width="190" height="50"/>
<text class="t12 mid" x="165" y="119">상부 다이</text>
<text class="t12 mid" x="165" y="229">하부 다이</text>
<line class="h" x1="272" y1="140" x2="272" y2="200"/>
<line class="h" x1="266" y1="140" x2="278" y2="140"/>
<line class="h" x1="266" y1="200" x2="278" y2="200"/>

<!-- 열 2 : MR-MUF — 범프 3개 + 언더필, 갭 54 -->
<rect x="350" y="146" width="31" height="54" fill="url(#hatch)"/>
<rect x="399" y="146" width="37" height="54" fill="url(#hatch)"/>
<rect x="454" y="146" width="37" height="54" fill="url(#hatch)"/>
<rect x="509" y="146" width="31" height="54" fill="url(#hatch)"/>
<rect class="s" x="381" y="146" width="18" height="54" rx="2"/>
<rect class="s" x="436" y="146" width="18" height="54" rx="2"/>
<rect class="s" x="491" y="146" width="18" height="54" rx="2"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="350" y="96"  width="190" height="50"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="350" y="200" width="190" height="50"/>
<line class="h" x1="552" y1="146" x2="552" y2="200"/>
<line class="h" x1="546" y1="146" x2="558" y2="146"/>
<line class="h" x1="546" y1="200" x2="558" y2="200"/>

<!-- 열 3 : HCB — 범프 없음, Cu 패드가 계면에서 직접 접합, 갭 12 -->
<rect class="s" x="661" y="188" width="18" height="12"/>
<rect class="s" x="716" y="188" width="18" height="12"/>
<rect class="s" x="771" y="188" width="18" height="12"/>
<line class="k-emph" stroke-width="2" x1="630" y1="194" x2="820" y2="194"/>
<line class="k-emph" stroke-width="1" x1="635" y1="199" x2="645" y2="189"/>
<line class="k-emph" stroke-width="1" x1="647" y1="199" x2="657" y2="189"/>
<line class="k-emph" stroke-width="1" x1="685" y1="199" x2="695" y2="189"/>
<line class="k-emph" stroke-width="1" x1="697" y1="199" x2="707" y2="189"/>
<line class="k-emph" stroke-width="1" x1="740" y1="199" x2="750" y2="189"/>
<line class="k-emph" stroke-width="1" x1="752" y1="199" x2="762" y2="189"/>
<line class="k-emph" stroke-width="1" x1="793" y1="199" x2="803" y2="189"/>
<line class="k-emph" stroke-width="1" x1="805" y1="199" x2="815" y2="189"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="630" y="138" width="190" height="50"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="630" y="200" width="190" height="50"/>
<line class="k-emph d" stroke-width="2" x1="832" y1="188" x2="832" y2="200"/>
<line class="k-emph" stroke-width="1" x1="826" y1="188" x2="838" y2="188"/>
<line class="k-emph" stroke-width="1" x1="826" y1="200" x2="838" y2="200"/>

<!-- 공통 갭 축 : 세 열의 갭 높이를 같은 축에 투영 -->
<text class="t11 end" x="890" y="130">다이 간 갭</text>
<line class="h" x1="868" y1="138" x2="868" y2="202"/>
<line class="h" x1="862" y1="140" x2="874" y2="140"/>
<line class="h" x1="862" y1="146" x2="874" y2="146"/>
<line class="h" x1="862" y1="188" x2="874" y2="188"/>

<!-- 부품 라벨 -->
<text class="t12 mid" x="165" y="274">마이크로 범프</text>
<text class="t12 mid" x="165" y="292">비전도성 필름 (NCF)</text>
<text class="t12 mid" x="445" y="274">마이크로 범프</text>
<text class="t12 mid" x="445" y="292">언더필 (MUF)</text>
<text class="t12 mid" x="725" y="274">범프 제거</text>
<text class="t12 mid" x="725" y="292">Cu-Cu 직접 접합</text>

<!-- 특징 1줄 -->
<text class="t11 mid" x="165" y="318">warpage·손상 이슈</text>
<text class="t11 mid" x="445" y="318">warpage 개선, 생산성 향상</text>
<text class="t11 mid" x="725" y="318">표면 청정도·정렬 요구</text>

<!-- HCB 정량 배지 2개 (기준은 TCB) -->
<text class="t11 mid" x="725" y="342">열저항 20% 이상 감소 (TCB 대비)</text>
<text class="t11 mid" x="725" y="358">스택 높이 15% 축소 (TCB 대비)</text>

<!-- pad pitch 행 : 세 열을 관통하는 가로 막대 + 10 µm 경계 눈금 -->
<line class="h" x1="65" y1="392" x2="825" y2="392"/>
<line class="h" x1="65" y1="386" x2="65" y2="398"/>
<line class="h" x1="825" y1="386" x2="825" y2="398"/>
<line class="s" x1="560" y1="380" x2="560" y2="404"/>
<text class="t11 mid" x="312" y="384">pad pitch 약 10 µm</text>
<text class="t11" x="568" y="384">HBM4 pad pitch 10 µm</text>

<!-- 스택 높이 한계 밴드 + 논리 관계 점선 화살표 -->
<line class="s d" x1="866" y1="212" x2="840" y2="414" marker-end="url(#ar)"/>
<rect class="s" x="65" y="418" width="780" height="38" rx="2"/>
<text class="t11 mid" x="455" y="442">스택 높이 한계 775 µm</text>
</svg>
