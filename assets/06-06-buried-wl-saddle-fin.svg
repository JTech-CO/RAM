<path fill="url(#dots)" d="M600,250h100v70h-100Z M740,250h100v70h-100Z"/>
<path class="h" d="M700,200H740 M700,216H740 M700,232H740 M700,248H740 M700,264H740 M700,280H740 M700,296H740 M700,312H740 M600,336H840 M600,352H660 M775,352H840 M600,368H840 M600,384H840"/>
