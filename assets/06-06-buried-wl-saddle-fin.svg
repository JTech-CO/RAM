<path class="h d" d="M390,166L286,212" marker-end="url(#ar)"/>
<path class="h d" d="M390,192L268,286" marker-end="url(#ar)"/>

<!-- 좌 패널 부품 라벨 -->
<text class="t12" x="50" y="60">접합 (소스/드레인)</text>
<path class="h" d="M110,64L125,158"/>
<text class="t12" x="50" y="80">게이트 트렌치</text>
<path class="h" d="M130,76L170,152"/>
<text class="t12" x="290" y="60">TiN 배리어</text>
<path class="h" d="M300,64L256,208"/>
<text class="t12" x="288" y="80">캡핑 절연막</text>
<path class="h" d="M288,84L262,168"/>
<text class="t12" x="50" y="366">게이트 산화막</text>
<path class="h" d="M142,362L176,304"/>
<text class="t12 mid" x="215" y="275">W</text>
<text class="t12 mid" transform="translate(78,215) rotate(-90)">STI 산화막</text>

<!-- 좌 패널 우측 라벨 열 -->
<text class="t11" x="386" y="240">GIDL</text>
<text class="t11" x="386" y="254">(Gate-Induced Drain Leakage)</text>
<path class="h" d="M384,247L286,222"/>
<text class="t11" x="386" y="300">DWMG</text>
<text class="t11" x="386" y="314">(dual work-function metal gate)</text>
<text class="t11" x="386" y="336">GIDL 억제 워크펑션 - 상부</text>
<path class="h" d="M382,332L256,230"/>
<text class="t11" x="386" y="354">Vth·구동력 워크펑션</text>
<text class="t11" x="386" y="368"> - 채널 중앙 하부</text>
<path class="h" d="M382,358L256,278"/>

