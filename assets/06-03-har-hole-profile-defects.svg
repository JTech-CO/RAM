<path class="k-emph" stroke-width="2" fill="url(#hatch)" d="M759,200L775.2,200L789,318L759,318Z"/>

<!-- 홀 벽 -->
<path class="s" d="M152,62V180 M204,62V180 M152,200V318H204V200"/>
<path class="s" d="M337,62L330.2,110L325,147L329,180 M389,62L395.8,110L401,147L397,180 M331.4,200L335.2,240L336.1,280L337,318L389,318L389.9,280L390.8,240L394.6,200"/>
<path class="s" d="M522,62V180 M574,62V180 M522,200L512,230L507,260L520,290L536,318L588,318L572,290L559,260L564,230L574,200"/>
<path class="s" d="M707,62L720.8,180 M759,62L772.8,180 M723.2,200L737,318L789,318L775.2,200"/>

<!-- 깊이 축 + 절단 표시 -->
<path class="h" d="M76,62V180 M76,200V318 M72,62H80 M72,318H80 M68,186L84,176 M68,196L84,186"/>
<text class="t11 end" x="72" y="66">0</text>
<text class="t11 end" x="72" y="322">깊이 6–10 µm</text>
<text class="t11 mid" transform="translate(44,140) rotate(-90)">깊이 축 축약</text>

<!-- 홀 직경 치수선 -->
<path class="h" d="M152,45H204" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path class="h" d="M152,49V62 M204,49V62"/>
<text class="t11 mid" x="178" y="36">홀 직경 100 nm 미만</text>
<text class="t11 end" x="821" y="54">ONON (oxide/nitride) 다층막</text>

<!-- 칸 제목 · 현상 -->
<text class="t14 mid" x="178" y="348">정상 프로파일</text>
<text class="t14 mid" x="363" y="348">bowing</text>
<text class="t14 mid" x="548" y="348">twisting</text>
<text class="t14 mid" x="733" y="348">tilting</text>
<text class="t11 mid" x="363" y="364">홀 중간이 옆으로 부풂</text>
<text class="t11 mid" x="548" y="364">홀이 깊이 방향으로 비틀림</text>
<text class="t11 mid" x="733" y="364">홀 전체가 기울어짐</text>

<!-- 하단 밴드 : 홀 간 편차 (홀 하나의 형상이 아니라 홀끼리의 문제) -->
<path class="h" d="M76,376H821"/>
<text class="t14" x="76" y="396">홀 간 편차</text>
<text class="t11" x="76" y="414">웨이퍼 내 홀끼리 CD·깊이가 어긋남</text>

