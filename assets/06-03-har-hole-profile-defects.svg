<svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 6-3. HAR 채널 홀의 대표적 프로파일 결함 3종</title>
<desc id="dsc">ONON 다층막을 관통하는 3D NAND 채널 홀의 정상 프로파일과 bowing·twisting·tilting 세 결함을 같은 깊이 축에 나란히 놓고, 정상 기준선을 벗어난 구간만 해칭으로 표시합니다. 아래 밴드는 홀 하나의 형상이 아니라 홀끼리의 CD·깊이 편차를 따로 다룹니다. 깊이 축은 절단 표시로 축약했으며 종횡비 수치는 본문이 두 계열을 병기 중이므로 표기하지 않습니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- ONON 질화막 밴드 (점 해칭) : 홀 내부는 evenodd 로 비움 -->
<path fill="url(#dots)" fill-rule="evenodd" d="M90,62h176v11h-176Z M90,84h176v11h-176Z M90,106h176v11h-176Z M90,128h176v11h-176Z M90,150h176v11h-176Z M90,172h176v8h-176Z M90,200h176v11h-176Z M90,222h176v11h-176Z M90,244h176v11h-176Z M90,266h176v11h-176Z M90,288h176v11h-176Z M90,310h176v11h-176Z M152,62L152,318L204,318L204,62Z"/>
<path fill="url(#dots)" fill-rule="evenodd" d="M275,62h176v11h-176Z M275,84h176v11h-176Z M275,106h176v11h-176Z M275,128h176v11h-176Z M275,150h176v11h-176Z M275,172h176v8h-176Z M275,200h176v11h-176Z M275,222h176v11h-176Z M275,244h176v11h-176Z M275,266h176v11h-176Z M275,288h176v11h-176Z M275,310h176v11h-176Z M337,62L330.2,110L325,147L329,180L331.4,200L335.2,240L336.1,280L337,318L389,318L389.9,280L390.8,240L394.6,200L397,180L401,147L395.8,110L389,62Z"/>
<path fill="url(#dots)" fill-rule="evenodd" d="M460,62h176v11h-176Z M460,84h176v11h-176Z M460,106h176v11h-176Z M460,128h176v11h-176Z M460,150h176v11h-176Z M460,172h176v8h-176Z M460,200h176v11h-176Z M460,222h176v11h-176Z M460,244h176v11h-176Z M460,266h176v11h-176Z M460,288h176v11h-176Z M460,310h176v11h-176Z M522,62L522,200L512,230L507,260L520,290L536,318L588,318L572,290L559,260L564,230L574,200L574,62Z"/>
<path fill="url(#dots)" fill-rule="evenodd" d="M645,62h176v11h-176Z M645,84h176v11h-176Z M645,106h176v11h-176Z M645,128h176v11h-176Z M645,150h176v11h-176Z M645,172h176v8h-176Z M645,200h176v11h-176Z M645,222h176v11h-176Z M645,244h176v11h-176Z M645,266h176v11h-176Z M645,288h176v11h-176Z M645,310h176v11h-176Z M707,62L720.8,180L723.2,200L737,318L789,318L775.2,200L772.8,180L759,62Z"/>

<!-- 정상 기준선 : 칸 1 의 좌·우 벽 x 를 네 칸 전부에 파선으로 -->
<path class="h d" d="M152,62V318 M204,62V318 M337,62V318 M389,62V318 M522,62V318 M574,62V318 M707,62V318 M759,62V318"/>

<!-- 다층막 외곽 (상단 개구는 끊고, 절단 구간 y180–200 은 비움) -->
<path class="s" d="M90,180V62H152 M204,62H266V180 M90,200V332H266V200"/>
<path class="s" d="M275,180V62H337 M389,62H451V180 M275,200V332H451V200"/>
<path class="s" d="M460,180V62H522 M574,62H636V180 M460,200V332H636V200"/>
<path class="s" d="M645,180V62H707 M759,62H821V180 M645,200V332H821V200"/>

<!-- 정상 대비 이탈 구간 (강조 윤곽 + 45° 해칭) -->
<path class="k-emph" stroke-width="2" fill="url(#hatch)" d="M337,62L330.2,110L325,147L329,180L337,180Z"/>
<path class="k-emph" stroke-width="2" fill="url(#hatch)" d="M389,62L395.8,110L401,147L397,180L389,180Z"/>
<path class="k-emph" stroke-width="2" fill="url(#hatch)" d="M522,200L512,230L507,260L520,290L536,318L522,318Z"/>
<path class="k-emph" stroke-width="2" fill="url(#hatch)" d="M574,200L564,230L559,260L572,290L588,318L574,318Z"/>
