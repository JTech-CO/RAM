<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 2-5. 6F² 셀과 4F²+VCT 셀의 레이아웃 및 전류 경로 비교</title>
<desc id="dsc">좌우 두 열이 완전히 같은 F 격자를 공유하며, 상단 띠는 셀 경계가 2×3칸과 2×2칸을 차지하는 평면도를, 하단 띠는 전류 경로의 굴절선과 직선을 측면 정투영으로 대조합니다. 격자는 무차원 F로만 표기하며 실측 셀 면적·F 수치·밀도 향상 수치는 넣지 않습니다. 4F²의 buried bitline은 셀 아래에 있어 가려짐을 낮은 불투명도로 표시했습니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- 열 머리 -->
<text class="t14 mid" x="180" y="24">6F²</text>
<text class="t14 mid" x="540" y="24">4F² + VCT</text>

<!-- F 눈금 (좌우 동일 칸 크기 = 34 px) -->
<line class="h" x1="112" y1="48" x2="146" y2="48"/>
<line class="h" x1="112" y1="44" x2="112" y2="52"/>
<line class="h" x1="146" y1="44" x2="146" y2="52"/>
<text class="t11 mid" x="129" y="40">F</text>
<line class="h" x1="472" y1="48" x2="506" y2="48"/>
<line class="h" x1="472" y1="44" x2="472" y2="52"/>
<line class="h" x1="506" y1="44" x2="506" y2="52"/>
<text class="t11 mid" x="489" y="40">F</text>

<!-- 좌 : F 격자 -->
<line class="h" x1="112" y1="56" x2="112" y2="192"/>
<line class="h" x1="146" y1="56" x2="146" y2="192"/>
<line class="h" x1="180" y1="56" x2="180" y2="192"/>
<line class="h" x1="214" y1="56" x2="214" y2="192"/>
<line class="h" x1="248" y1="56" x2="248" y2="192"/>
<line class="h" x1="112" y1="56" x2="248" y2="56"/>
<line class="h" x1="112" y1="90" x2="248" y2="90"/>
<line class="h" x1="112" y1="124" x2="248" y2="124"/>
<line class="h" x1="112" y1="158" x2="248" y2="158"/>
<line class="h" x1="112" y1="192" x2="248" y2="192"/>

<!-- 우 : 동일한 F 격자 -->
<line class="h" x1="472" y1="56" x2="472" y2="192"/>
<line class="h" x1="506" y1="56" x2="506" y2="192"/>
<line class="h" x1="540" y1="56" x2="540" y2="192"/>
<line class="h" x1="574" y1="56" x2="574" y2="192"/>
<line class="h" x1="608" y1="56" x2="608" y2="192"/>
<line class="h" x1="472" y1="56" x2="608" y2="56"/>
<line class="h" x1="472" y1="90" x2="608" y2="90"/>
<line class="h" x1="472" y1="124" x2="608" y2="124"/>
<line class="h" x1="472" y1="158" x2="608" y2="158"/>
<line class="h" x1="472" y1="192" x2="608" y2="192"/>

<!-- 좌 : 비트라인 (셀과 같은 층) -->
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" x="172" y="40" width="16" height="156"/>
<!-- 우 : buried bitline (셀 아래 독립 공간 - 가려짐) -->
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-opacity="0.45" stroke-width="2" x="528" y="40" width="24" height="156"/>

<!-- 워드라인 (좌우 공통 수평 배선) -->
<line class="s" x1="96" y1="90" x2="254" y2="90"/>
<line class="s" x1="456" y1="90" x2="614" y2="90"/>

<!-- 좌 : 6F² 셀 경계 (2 × 3칸) -->
<rect class="s" x="146" y="56" width="68" height="102"/>
<!-- 우 : 4F² 셀 경계 (2 × 2칸) -->
<rect class="s" x="506" y="56" width="68" height="68"/>

<!-- 좌 : buried contact 과 비트라인의 점유 충돌 -->
<rect class="s" x="166" y="104" width="28" height="28"/>
<rect fill="url(#hatch)" x="172" y="104" width="16" height="28"/>

<!-- 커패시터 위치 -->
<circle class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" cx="157" cy="73" r="10"/>
<circle class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" cx="540" cy="73" r="11"/>

<!-- 면적 -->
<text class="t11 mid" x="180" y="210">6F²</text>
<text class="t11 mid" x="540" y="210">4F² (6F² 대비 2/3)</text>

<!-- 평면도 지시선 -->
<line class="h" x1="258" y1="90" x2="254" y2="90"/>
<line class="h" x1="415" y1="90" x2="456" y2="90"/>
<line class="h" x1="258" y1="140" x2="190" y2="140"/>
<line class="h" x1="258" y1="170" x2="196" y2="134"/>
<line class="h" x1="99" y1="160" x2="166" y2="130"/>
<line class="h" x1="60" y1="73" x2="145" y2="73"/>
<line class="h" x1="614" y1="73" x2="553" y2="73"/>
<line class="h" x1="614" y1="140" x2="554" y2="140"/>
<line class="h" x1="614" y1="176" x2="554" y2="170"/>

<!-- 평면도 라벨 -->
<text class="t12" x="262" y="86">워드라인 (Word Line, WL)</text>
<text class="t12" x="262" y="142">비트라인 (Bit Line, BL)</text>
<text class="t12" x="262" y="172">buried contact</text>
<text class="t12" x="8" y="164">같은 층에서 혼잡</text>
<text class="t12" x="8" y="76">커패시터</text>
<text class="t12" x="618" y="76">커패시터</text>
<text class="t12" x="618" y="142">buried bitline</text>
<text class="t12" x="618" y="180">독립 공간</text>

<!-- 하단 띠 : 전류 경로 측면 정투영 -->
<text class="t12 mid" x="100" y="238">커패시터</text>
<text class="t12 mid" x="520" y="238">커패시터</text>
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" x="80" y="244" width="40" height="36"/>
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" x="500" y="244" width="40" height="36"/>
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" x="228" y="284" width="58" height="16"/>
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" x="480" y="318" width="80" height="16"/>

<!-- 경로 강조 영역 (점선) + 경로 실선 -->
<rect class="s d k-emph" x="88" y="272" width="176" height="68" rx="2"/>
<rect class="s d k-emph" x="504" y="272" width="32" height="60" rx="2"/>
<path class="s k-emph" d="M100,280 L100,314 L140,314 L140,330 L210,330 L210,314 L250,314 L250,300"/>
<path class="s k-emph" d="M520,280 L520,318"/>

<!-- 채널 라벨 -->
<text class="t12 mid" x="175" y="352">수평 채널</text>
<text class="t12 mid" x="540" y="352">수직 채널 (Vertical Channel Transistor, VCT)</text>

<!-- 경로 길이 비교 (수치 없음) -->
<line class="h" x1="80" y1="366" x2="310" y2="366" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line class="h" x1="500" y1="366" x2="538" y2="366" marker-start="url(#ar)" marker-end="url(#ar)"/>

<!-- 경로 문자열 -->
<text class="t11 mid" x="180" y="382">커패시터 → 수평 채널 → 컨택 → 비트라인</text>
<text class="t11 mid" x="540" y="382">커패시터 → 수직 채널 → 비트라인</text>
<text class="t11 mid" x="180" y="396">경로 굴절에 따른 저항</text>
<text class="t11 mid" x="540" y="396">경로 단축으로 저항 감소</text>
</svg>
