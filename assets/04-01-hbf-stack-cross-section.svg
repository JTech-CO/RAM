<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="164" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="180" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="196" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="212" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="228" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="244" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="260" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="276" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="292" width="140" height="12"/>
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="308" width="140" height="12"/>

<!-- TSV : 최상단 다이에서 인터포저 상면까지 끊기지 않고 관통 -->
<line class="s" x1="244" y1="68" x2="244" y2="340"/>
<line class="s" x1="276" y1="68" x2="276" y2="340"/>
<line class="s" x1="308" y1="68" x2="308" y2="340"/>
<line class="s" x1="340" y1="68" x2="340" y2="340"/>

