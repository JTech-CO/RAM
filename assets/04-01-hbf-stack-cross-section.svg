<line class="h" x1="324" y1="326" x2="324" y2="340"/>
<line class="h" x1="356" y1="326" x2="356" y2="340"/>

<!-- 좌측 라벨 열 -->
<text class="t14 end" x="206" y="76">HBF</text>
<line class="h" x1="210" y1="130" x2="222" y2="130"/>
<text class="t12 end" x="206" y="134">BiCS NAND 다이 × 16단</text>
<line class="h" x1="210" y1="194" x2="244" y2="194"/>
<text class="t12 end" x="206" y="198">관통 실리콘 비아 (TSV)</text>

<!-- [벤더 목표치] 배지 상자 -->
<rect class="k-emph d" fill="none" stroke-width="1" x="230" y="20" width="164" height="36"/>
<text class="t11" x="238" y="36">16-die × 256 Gb</text>
<text class="t11" x="238" y="50">[벤더 목표치]</text>
<line class="h" x1="290" y1="56" x2="290" y2="62"/>

<!-- ================= 지시선 + 절단 표시 (배율 상이) ================= -->
<line class="h" x1="362" y1="164" x2="402" y2="78"/>
<line class="h" x1="375.5" y1="123.2" x2="384.5" y2="127.4"/>
<line class="h" x1="379.5" y1="114.6" x2="388.5" y2="118.8"/>
