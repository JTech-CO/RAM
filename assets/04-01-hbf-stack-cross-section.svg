<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 4-1. HBF 스택 단면 구조. TSV로 관통 적층된 NAND 다이와 CBA 본딩 계면, 인터포저 위 가속기 인접 배치</title>
<desc id="dsc">실리콘 인터포저 위에 가속기 다이와 HBF 스택이 나란히 놓인 수직 단면으로, 스택은 BiCS NAND 다이 16장을 TSV로 관통 적층하고 다이 1장을 확대한 콜아웃에서 셀 웨이퍼와 CMOS 주변회로 웨이퍼가 미세 구리 패드로 접합된 CBA 2층 구조를 보입니다. 16-die × 256 Gb는 벤더 목표치이며, 스택 하단의 컨트롤러 역할 분담과 패키징·전기 인터페이스 수치는 미공개이므로 그리지 않았습니다. 다이 두께 12 px, 접합 갭 4 px, 피치 16 px, 스택 폭 140 px, 인터포저 상면 y=340은 HBM 스택 단면 그림과 공유하는 px 단위입니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- ================= 좌: 본체 단면 (인터포저 상면 y=340, 다이 두께 12 / 갭 4 / 피치 16 / 스택 폭 140) ================= -->

<!-- 패키지 기판 -->
<rect class="s" x="20" y="376" width="360" height="20"/>
<text class="t12 mid" x="200" y="390">패키지 기판 (package substrate)</text>

<!-- 실리콘 인터포저 -->
<rect class="s" x="30" y="340" width="340" height="32"/>
<line class="h" x1="100" y1="345" x2="300" y2="345"/>
<line class="h" x1="100" y1="349" x2="300" y2="349"/>
<line class="h" x1="100" y1="353" x2="300" y2="353"/>
<text class="t12 mid" x="200" y="366">실리콘 인터포저 (silicon interposer)</text>

<!-- 가속기 다이 -->
<rect class="s" x="45" y="300" width="130" height="40"/>
<text class="t12 mid" x="110" y="324">가속기 (accelerator)</text>

<!-- 가속기 ↔ 스택 인터포저 배선 -->
<line class="s" x1="178" y1="310" x2="212" y2="310" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="t11 mid" x="195" y="302">수 mm</text>

<!-- HBF 스택 외곽 그룹선 -->
<rect class="k-hbf" fill="none" stroke-width="2" x="214" y="62" width="152" height="264"/>

<!-- BiCS NAND 다이 16장 -->
<rect class="f-nand k-nand" fill-opacity="0.15" stroke-width="2" x="220" y="68"  width="140" height="12"/>
