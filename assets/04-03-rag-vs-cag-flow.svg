<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 4-3. RAG와 CAG의 데이터 흐름 비교. CAG는 사전 1회 생성한 KV cache를 다중 요청이 공유한다</title>
<desc id="dsc">상단은 요청마다 검색·KV 재계산·생성을 통째로 반복하는 RAG 경로, 하단은 문서 집합의 KV cache를 사전에 한 번 생성해 두고 다중 요청이 그 결과를 공유하는 CAG 경로입니다. 공유 KV cache 블록에서 세 요청으로 발산하는 재사용 화살표가 한 번 쓰고 여러 번 읽음·읽을 위치가 미리 정해짐·큰 덩어리 단위로 읽힘이라는 세 조건을 동시에 성립시킵니다. 요청 3개는 다중 요청의 최소 표현이며 개수를 정량화한 값이 아닙니다. 두 방식의 지연·정확도 정량 비교는 이 그림의 소관이 아닙니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- ================= 상단 : RAG (요청마다 전 단계 반복) ================= -->
<text class="t14" x="24" y="40">RAG</text>

<!-- 레인 1 -->
<rect class="s" x="60" y="52" width="100" height="32"/>
<text class="t11 mid" x="110" y="72">요청 1</text>
<line class="s" x1="162" y1="68" x2="198" y2="68" marker-end="url(#ar)"/>
<rect class="s" x="200" y="52" width="100" height="32"/>
<text class="t11 mid" x="250" y="72">검색 (retrieve)</text>
<line class="s" x1="302" y1="68" x2="338" y2="68" marker-end="url(#ar)"/>
<rect class="s" x="340" y="52" width="100" height="32"/>
<text class="t11 mid" x="390" y="72">KV 재계산</text>
<line class="s" x1="442" y1="68" x2="478" y2="68" marker-end="url(#ar)"/>
<rect class="s" x="480" y="52" width="100" height="32"/>
<text class="t11 mid" x="530" y="72">생성</text>

<!-- 레인 2 -->
<rect class="s" x="60" y="104" width="100" height="32"/>
<text class="t11 mid" x="110" y="124">요청 2</text>
<line class="s" x1="162" y1="120" x2="198" y2="120" marker-end="url(#ar)"/>
<rect class="s" x="200" y="104" width="100" height="32"/>
<text class="t11 mid" x="250" y="124">검색 (retrieve)</text>
<line class="s" x1="302" y1="120" x2="338" y2="120" marker-end="url(#ar)"/>
<rect class="s" x="340" y="104" width="100" height="32"/>
<text class="t11 mid" x="390" y="124">KV 재계산</text>
<line class="s" x1="442" y1="120" x2="478" y2="120" marker-end="url(#ar)"/>
<rect class="s" x="480" y="104" width="100" height="32"/>
<text class="t11 mid" x="530" y="124">생성</text>

<!-- 레인 3 -->
<rect class="s" x="60" y="156" width="100" height="32"/>
<text class="t11 mid" x="110" y="176">요청 3</text>
<line class="s" x1="162" y1="172" x2="198" y2="172" marker-end="url(#ar)"/>
<rect class="s" x="200" y="156" width="100" height="32"/>
<text class="t11 mid" x="250" y="176">검색 (retrieve)</text>
<line class="s" x1="302" y1="172" x2="338" y2="172" marker-end="url(#ar)"/>
<rect class="s" x="340" y="156" width="100" height="32"/>
<text class="t11 mid" x="390" y="176">KV 재계산</text>
<line class="s" x1="442" y1="172" x2="478" y2="172" marker-end="url(#ar)"/>
<rect class="s" x="480" y="156" width="100" height="32"/>
<text class="t11 mid" x="530" y="176">생성</text>

<!-- 세 레인을 묶는 세로 대괄호 -->
<path class="h" fill="none" d="M596,52 L610,52 L610,188 L596,188"/>
<text class="t12" x="618" y="124">매 요청 반복</text>

<!-- ================= 단 구분선 ================= -->
<line class="h" x1="20" y1="208" x2="700" y2="208"/>

<!-- ================= 하단 : CAG (사전 1회 생성 → 다중 요청 공유) ================= -->
<text class="t14" x="24" y="232">CAG (Cache-Augmented Generation)</text>

<rect class="s" x="20" y="246" width="100" height="32"/>
<text class="t11 mid" x="70" y="266">문서 집합</text>
<line class="s" x1="122" y1="262" x2="156" y2="262" marker-end="url(#ar)"/>
<rect class="s" x="158" y="246" width="100" height="32"/>
<text class="t11 mid" x="208" y="261">KV cache</text>
<text class="t11 mid" x="208" y="274">사전 1회 생성</text>
<line class="s" x1="260" y1="262" x2="294" y2="262" marker-end="url(#ar)"/>

<!-- 공유 KV cache 저장 블록 : HBF 계층색 + 45° 해칭 + 강조색 점선 테두리 -->
<text class="t12 mid" x="346" y="240">공유 KV cache</text>
<rect class="f-hbf" fill-opacity="0.15" x="296" y="246" width="100" height="136"/>
<rect x="296" y="246" width="100" height="136" fill="url(#hatch)"/>
<rect class="k-emph d" fill="none" stroke-width="2" x="296" y="246" width="100" height="136"/>

<!-- 재사용 화살표 3개 : 한 지점에서 발산 -->
<text class="t11 mid" x="424" y="240">재사용</text>
<line class="k-emph" stroke-width="2" x1="398" y1="314" x2="450" y2="262" marker-end="url(#ar)"/>
<line class="k-emph" stroke-width="2" x1="398" y1="314" x2="450" y2="314" marker-end="url(#ar)"/>
<line class="k-emph" stroke-width="2" x1="398" y1="314" x2="450" y2="366" marker-end="url(#ar)"/>

<!-- 요청 3개 + 생성 -->
<rect class="s" x="452" y="246" width="100" height="32"/>
<text class="t11 mid" x="502" y="266">요청 1</text>
<line class="s" x1="554" y1="262" x2="586" y2="262" marker-end="url(#ar)"/>
<rect class="s" x="588" y="246" width="100" height="32"/>
<text class="t11 mid" x="638" y="266">생성</text>

<rect class="s" x="452" y="298" width="100" height="32"/>
<text class="t11 mid" x="502" y="318">요청 2</text>
<line class="s" x1="554" y1="314" x2="586" y2="314" marker-end="url(#ar)"/>
<rect class="s" x="588" y="298" width="100" height="32"/>
<text class="t11 mid" x="638" y="318">생성</text>

<rect class="s" x="452" y="350" width="100" height="32"/>
<text class="t11 mid" x="502" y="370">요청 3</text>
<line class="s" x1="554" y1="366" x2="586" y2="366" marker-end="url(#ar)"/>
<rect class="s" x="588" y="350" width="100" height="32"/>
<text class="t11 mid" x="638" y="370">생성</text>

<!-- 조건 태그 3개 -->
<path class="h d" fill="none" d="M306,382 L306,441 M306,400 L312,400 M306,420 L312,420 M306,440 L312,440"/>
<text class="t11" x="316" y="404">한 번 쓰고 여러 번 읽음</text>
<text class="t11" x="316" y="424">읽을 위치가 미리 정해짐</text>
<text class="t11" x="316" y="444">큰 덩어리 단위로 읽힘</text>
</svg>
