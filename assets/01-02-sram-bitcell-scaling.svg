<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 1-2. 노드별 SRAM HD 비트셀 크기 추이와 N5 → N3E 정체 구간</title>
<desc id="dsc">HD 비트셀 면적을 0에서 시작하는 선형 축의 가로 막대 4개로 비교합니다. TSMC N5와 N3E의 막대 길이가 완전히 같고, N2는 출처가 갈리는 범위여서 상단 구간을 점선으로 표시했습니다. 서로 다른 파운드리를 하나의 시계열로 읽지 않도록 TSMC와 Intel을 구분선으로 나눴습니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- 축척 : x(v) = 170 + v × 19200  (0 → 170, 0.025 → 650) -->

<!-- 정체 구간 해칭 (막대 뒤에 깔아 가리지 않게) -->
<rect x="162" y="60" width="426" height="106" fill="url(#hatch)" fill-opacity="0.16"/>

<!-- 세로 격자 · 가로축 -->
<line class="h" x1="170" y1="52" x2="170" y2="290"/>
<line class="h" x1="266" y1="52" x2="266" y2="290"/>
<line class="h" x1="362" y1="52" x2="362" y2="290"/>
<line class="h" x1="458" y1="52" x2="458" y2="290"/>
<line class="h" x1="554" y1="52" x2="554" y2="290"/>
<line class="h" x1="650" y1="52" x2="650" y2="290"/>
<line class="h" x1="170" y1="290" x2="650" y2="290"/>

<!-- 막대 4개 : 전부 SRAM 계층색 -->
<rect class="f-sram k-sram" fill-opacity="0.15" stroke-width="2" x="170" y="70"  width="403.2" height="34"/>
<rect class="f-sram k-sram" fill-opacity="0.15" stroke-width="2" x="170" y="122" width="403.2" height="34"/>
<rect class="f-sram k-sram" fill-opacity="0.15" stroke-width="2" x="170" y="174" width="336"   height="34"/>
<rect class="k-sram d" fill="none" stroke-width="2" x="506" y="174" width="67.2" height="34"/>
<rect class="f-sram k-sram" fill-opacity="0.15" stroke-width="2" x="170" y="226" width="403.2" height="34"/>

<!-- 정체 구간 테두리 (막대 위) -->
<rect class="k-emph d" fill="none" stroke-width="2" x="162" y="60" width="426" height="106"/>

<!-- 0.021 기준 수직선 -->
<line class="k-emph d" stroke-width="1" x1="573.2" y1="52" x2="573.2" y2="290"/>

<!-- 벤더 구분선 -->
<line class="h" x1="20" y1="217" x2="650" y2="217"/>

<!-- 행 라벨 -->
<text class="t12 end" x="155" y="92">TSMC N5</text>
<text class="t12 end" x="155" y="144">TSMC N3E</text>
<text class="t12 end" x="155" y="196">TSMC N2</text>
<text class="t12 end" x="155" y="248">Intel 18A</text>

<!-- 벤더 그룹 라벨 (세로) -->
<text class="t12 mid" transform="rotate(-90 32 139)" x="32" y="139">TSMC</text>
<text class="t12 mid" transform="rotate(-90 32 243)" x="32" y="243">Intel</text>

<!-- 수치 라벨 -->
<text class="t11" x="584" y="92">0.021</text>
<text class="t11" x="584" y="144">0.021</text>
<text class="t11" x="584" y="190">0.0175 ~ 0.021</text>
<text class="t11" x="584" y="205">[미확정]</text>
<text class="t11" x="584" y="248">0.021</text>

<!-- 강조 라벨 -->
<text class="t14 mid" x="375" y="44">정체 구간 (N5 → N3E)</text>

<!-- 눈금 · 축 라벨 -->
<text class="t11 mid" x="170" y="308">0</text>
<text class="t11 mid" x="266" y="308">0.005</text>
<text class="t11 mid" x="362" y="308">0.010</text>
<text class="t11 mid" x="458" y="308">0.015</text>
<text class="t11 mid" x="554" y="308">0.020</text>
<text class="t11 mid" x="650" y="308">0.025</text>
<text class="t14 mid" x="410" y="338">HD 비트셀 면적 (µm²)</text>
</svg>
