<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">그림 5-2. 3D NAND의 수직 적층 단면과 채널 홀 종횡비</title>
<desc id="dsc">셀 어레이 웨이퍼를 세로로 관통하는 채널 홀 1개의 평면 수직 단면입니다. 워드라인 판은 상하 6장씩만 그리고 나머지는 절단 표시로 축약했으며, 하단에 미세 구리 패드 본딩 계면과 CMOS 주변회로 웨이퍼를 둡니다. 좌측 깊이 스케일 바는 100 nm 눈금으로 #24(DRAM 커패시터)와 같은 단위이며, 절단 표시 위·아래로 실제 그려진 구간에만 적용되고 축약된 구간은 포함하지 않습니다. 면적 밀도 29 Gb/mm² 초과는 Kioxia/SanDisk 발표 기준이며 제3자 다이 분석으로 교차 확인된 값이 아닙니다. 우측 종횡비 눈금은 96층·400층·1,000층 세 세대 값만 담으며 332층의 종횡비는 본문에 없어 표기하지 않았습니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- 상단 라벨 : 셀 어레이 웨이퍼 x130–480, 채널 홀 중심 x=247 -->
<text class="t14" x="130" y="20">셀 어레이 웨이퍼</text>
<text class="t11 end" x="480" y="20">면적 밀도 29 Gb/mm² 초과</text>
<text class="t12 mid" x="247" y="38">채널 홀</text>
<line class="h" x1="247" y1="42" x2="247" y2="50"/>
<text class="t12 end" x="480" y="38">워드라인 (WL)</text>
<line class="h" x1="440" y1="42" x2="440" y2="52"/>

<!-- 깊이 스케일 바 : 34 px = 100 nm (#24와 동일 단위·동일 px-per-nm) -->
<line class="h" x1="62" y1="60" x2="62" y2="196"/>
<line class="h" x1="56" y1="60" x2="68" y2="60"/>
<line class="h" x1="56" y1="94" x2="68" y2="94"/>
<line class="h" x1="56" y1="128" x2="68" y2="128"/>
<line class="h" x1="56" y1="162" x2="68" y2="162"/>
<line class="h" x1="56" y1="196" x2="68" y2="196"/>
<text class="t11 end" x="52" y="64">0</text>
<text class="t11 end" x="52" y="132">200</text>
<text class="t11 end" x="52" y="200">400 nm</text>

<!-- 층수 치수선 -->
