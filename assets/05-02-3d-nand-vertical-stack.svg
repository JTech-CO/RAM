<rect class="k-nand" fill="none" stroke-width="2" x="130" y="356" width="350" height="12"/>

<!-- ===== 채널 홀 : 폭 14 px : 표시 높이 320 px = 1 : 22.9 ===== -->
<line class="h" x1="242" y1="50" x2="242" y2="196"/>
