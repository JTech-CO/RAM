<!-- ===== 절단 표시 : 지그재그 2줄 (구조선 굵기, 축약이 눈에 띄어야 함) ===== -->
<polyline class="s" points="130,196 155,208 180,196 205,208 230,196 255,208 280,196 305,208 330,196 355,208 380,196 405,208 430,196 455,208 480,196"/>
<polyline class="s" points="130,212 155,224 180,212 205,224 230,212 255,224 280,212 305,224 330,212 355,224 380,212 405,224 430,212 455,224 480,212"/>
