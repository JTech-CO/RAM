<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">DDR5·HBM3E·HBM4의 버스 폭 비교</title>
<desc id="dsc">버스 폭은 64에서 2048-bit로 32배 늘어나는 반면 핀당 전송률은 약 6에서 8 GT/s로 1.3배에 그친다. 두 패널은 각각 자기 축을 가지며 스케일을 공유하지 않습니다. DDR5의 약 6 GT/s는 모듈 약 50 GB/s를 64-bit로 나눈 계산값입니다.</desc>
<style>
  :root{ --stroke:#1F2328; --hint:#8B949E; }
  @media (prefers-color-scheme:dark){ :root{ --stroke:#E6EDF3; } }
  .s{ stroke:var(--stroke); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .h{ stroke:var(--hint); fill:none; stroke-width:1; }
  .d{ stroke-dasharray:4 3; }
  text{ fill:var(--stroke); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .t14{ font-size:14px; } .t12{ font-size:12px; } .t11{ font-size:11px; }
  .mid{ text-anchor:middle; } .end{ text-anchor:end; }
  .f-sram{ fill:#0072B2; } .f-dram{ fill:#009E73; } .f-hbm{ fill:#56B4E9; }
  .f-hbf{ fill:#CC79A7; }  .f-nand{ fill:#E69F00; } .f-emph{ fill:#D55E00; }
  .k-sram{ stroke:#0072B2; } .k-dram{ stroke:#009E73; } .k-hbm{ stroke:#56B4E9; }
  .k-hbf{ stroke:#CC79A7; }  .k-nand{ stroke:#E69F00; } .k-emph{ stroke:#D55E00; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--stroke)"/>
  </marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--stroke)" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="var(--hint)"/>
  </pattern>
</defs>

<!-- ===== 상단 주 패널 : 버스 폭. x 150(0) ~ 690(2048), 1 bit = 0.263672 px ===== -->
<text class="t14" x="150" y="44">버스 폭 (bit) — 선형 눈금</text>

<!-- 막대 : 64 / 1024 / 2048 → 16.875 / 270 / 540 px -->
<rect class="f-dram k-dram" fill-opacity="0.15" stroke-width="2" x="150" y="96" width="16.875" height="44"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="150" y="174" width="270" height="44"/>
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="150" y="252" width="540" height="44"/>

<!-- 채널 분할선 : HBM3E 16등분 (한 칸 16.875 px) -->
<line class="h" x1="166.875" y1="174" x2="166.875" y2="218"/>
<line class="h" x1="183.75" y1="174" x2="183.75" y2="218"/>
<line class="h" x1="200.625" y1="174" x2="200.625" y2="218"/>
<line class="h" x1="217.5" y1="174" x2="217.5" y2="218"/>
<line class="h" x1="234.375" y1="174" x2="234.375" y2="218"/>
<line class="h" x1="251.25" y1="174" x2="251.25" y2="218"/>
<line class="h" x1="268.125" y1="174" x2="268.125" y2="218"/>
<line class="h" x1="285" y1="174" x2="285" y2="218"/>
<line class="h" x1="301.875" y1="174" x2="301.875" y2="218"/>
<line class="h" x1="318.75" y1="174" x2="318.75" y2="218"/>
<line class="h" x1="335.625" y1="174" x2="335.625" y2="218"/>
<line class="h" x1="352.5" y1="174" x2="352.5" y2="218"/>
<line class="h" x1="369.375" y1="174" x2="369.375" y2="218"/>
<line class="h" x1="386.25" y1="174" x2="386.25" y2="218"/>
<line class="h" x1="403.125" y1="174" x2="403.125" y2="218"/>

<!-- 채널 분할선 : HBM4 32등분 (한 칸 16.875 px) -->
<line class="h" x1="166.875" y1="252" x2="166.875" y2="296"/>
<line class="h" x1="183.75" y1="252" x2="183.75" y2="296"/>
<line class="h" x1="200.625" y1="252" x2="200.625" y2="296"/>
<line class="h" x1="217.5" y1="252" x2="217.5" y2="296"/>
<line class="h" x1="234.375" y1="252" x2="234.375" y2="296"/>
<line class="h" x1="251.25" y1="252" x2="251.25" y2="296"/>
<line class="h" x1="268.125" y1="252" x2="268.125" y2="296"/>
<line class="h" x1="285" y1="252" x2="285" y2="296"/>
<line class="h" x1="301.875" y1="252" x2="301.875" y2="296"/>
<line class="h" x1="318.75" y1="252" x2="318.75" y2="296"/>
<line class="h" x1="335.625" y1="252" x2="335.625" y2="296"/>
<line class="h" x1="352.5" y1="252" x2="352.5" y2="296"/>
<line class="h" x1="369.375" y1="252" x2="369.375" y2="296"/>
<line class="h" x1="386.25" y1="252" x2="386.25" y2="296"/>
<line class="h" x1="403.125" y1="252" x2="403.125" y2="296"/>
<line class="h" x1="420" y1="252" x2="420" y2="296"/>
<line class="h" x1="436.875" y1="252" x2="436.875" y2="296"/>
<line class="h" x1="453.75" y1="252" x2="453.75" y2="296"/>
<line class="h" x1="470.625" y1="252" x2="470.625" y2="296"/>
<line class="h" x1="487.5" y1="252" x2="487.5" y2="296"/>
<line class="h" x1="504.375" y1="252" x2="504.375" y2="296"/>
<line class="h" x1="521.25" y1="252" x2="521.25" y2="296"/>
<line class="h" x1="538.125" y1="252" x2="538.125" y2="296"/>
<line class="h" x1="555" y1="252" x2="555" y2="296"/>
<line class="h" x1="571.875" y1="252" x2="571.875" y2="296"/>
<line class="h" x1="588.75" y1="252" x2="588.75" y2="296"/>
<line class="h" x1="605.625" y1="252" x2="605.625" y2="296"/>
<line class="h" x1="622.5" y1="252" x2="622.5" y2="296"/>
<line class="h" x1="639.375" y1="252" x2="639.375" y2="296"/>
<line class="h" x1="656.25" y1="252" x2="656.25" y2="296"/>
<line class="h" x1="673.125" y1="252" x2="673.125" y2="296"/>

<!-- 분할 한 칸이 DDR5 막대 전체와 같은 폭임을 잇는 수직 보조선 -->
<line class="h d" x1="166.875" y1="76" x2="166.875" y2="96"/>
<line class="h d" x1="166.875" y1="140" x2="166.875" y2="174"/>
<line class="h d" x1="166.875" y1="218" x2="166.875" y2="252"/>
<line class="h d" x1="690" y1="76" x2="690" y2="252"/>
<line class="h" x1="150" y1="242" x2="150" y2="246"/>
<line class="h" x1="150" y1="246" x2="166.875" y2="246"/>

<!-- 배율 치수선 : 강조색 + 파선 -->
<line class="k-emph d" stroke-width="2" x1="166.875" y1="76" x2="690" y2="76" marker-start="url(#ar)" marker-end="url(#ar)"/>

<!-- 주 패널 x축 -->
<line class="h" x1="150" y1="300" x2="690" y2="300"/>
<line class="h" x1="150" y1="300" x2="150" y2="305"/>
<line class="h" x1="285" y1="300" x2="285" y2="305"/>
<line class="h" x1="420" y1="300" x2="420" y2="305"/>
<line class="h" x1="555" y1="300" x2="555" y2="305"/>
<line class="h" x1="690" y1="300" x2="690" y2="305"/>
<text class="t11 mid" x="150" y="317">0</text>
<text class="t11 mid" x="285" y="317">512</text>
<text class="t11 mid" x="420" y="317">1024</text>
<text class="t11 mid" x="555" y="317">1536</text>
<text class="t11 mid" x="690" y="317">2048</text>

<!-- 주 패널 라벨 -->
<text class="t14 end" x="140" y="123">DDR5</text>
<text class="t14 end" x="140" y="201">HBM3E</text>
<text class="t14 end" x="140" y="279">HBM4</text>
<text class="t11 mid" x="428" y="68">× 32 (2048 ÷ 64)</text>
<text class="t12" x="176" y="123">64-bit</text>
<text class="t12" x="430" y="194">1024-bit</text>
<text class="t11" x="430" y="210">독립 채널 16개</text>
<text class="t12 end" x="684" y="244">2048-bit</text>
<text class="t11" x="176" y="246">독립 채널 32개</text>

<!-- ===== 하단 보조 패널 : 핀당 전송률. x 150(0) ~ 470(8 GT/s), 1 GT/s = 40 px ===== -->
<text class="t14" x="150" y="342">핀당 전송률 (GT/s) — 선형 눈금</text>

<!-- DDR5 약 6 GT/s → 240 px, 환산값이므로 점선 테두리 -->
<rect class="f-dram" fill-opacity="0.15" x="150" y="350" width="240" height="18"/>
<rect class="k-dram d" fill="none" stroke-width="2" x="150" y="350" width="240" height="18"/>
<!-- HBM4 8 GT/s → 320 px, JEDEC 확정값이므로 실선 테두리 -->
<rect class="f-hbm k-hbm" fill-opacity="0.15" stroke-width="2" x="150" y="382" width="320" height="18"/>

<!-- 배율 치수선 : 같은 강조색 + 같은 파선 -->
<line class="h" x1="390" y1="369" x2="390" y2="381"/>
<line class="h" x1="470" y1="369" x2="470" y2="381"/>
<line class="k-emph d" stroke-width="2" x1="390" y1="375" x2="470" y2="375" marker-start="url(#ar)" marker-end="url(#ar)"/>

<!-- 보조 패널 x축 -->
<line class="h" x1="150" y1="404" x2="470" y2="404"/>
<line class="h" x1="150" y1="404" x2="150" y2="408"/>
<line class="h" x1="230" y1="404" x2="230" y2="408"/>
<line class="h" x1="310" y1="404" x2="310" y2="408"/>
<line class="h" x1="390" y1="404" x2="390" y2="408"/>
<line class="h" x1="470" y1="404" x2="470" y2="408"/>
<text class="t11 mid" x="150" y="418">0</text>
<text class="t11 mid" x="230" y="418">2</text>
<text class="t11 mid" x="310" y="418">4</text>
<text class="t11 mid" x="390" y="418">6</text>
<text class="t11 mid" x="470" y="418">8</text>

<!-- 보조 패널 라벨 -->
<text class="t14 end" x="140" y="364">DDR5</text>
<text class="t14 end" x="140" y="396">HBM4</text>
<text class="t11 end" x="384" y="363">약 6 GT/s (계산값)</text>
<text class="t11 end" x="464" y="395">8 GT/s (JEDEC 기준)</text>
<text class="t11" x="478" y="379">× 1.3</text>
<text class="t11 end" x="700" y="418">DDR5: 약 50 GB/s ÷ 64-bit 환산</text>
</svg>
